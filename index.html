<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Compressor AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Image Compressor AI</h1>

  <input type="file" id="upload" accept="image/*">

  <label>Width:</label>
  <input type="range" id="widthRange" min="100" max="1200" value="600">

  <label>Height:</label>
  <input type="range" id="heightRange" min="100" max="1200" value="600">

  <label>Quality:</label>
  <input type="range" id="qualityRange" min="0.1" max="1" step="0.1" value="0.9">

  <label>File Name:</label>
  <input type="text" id="fileName" placeholder="my-image">

  <canvas id="canvas"></canvas>

  <button id="downloadBtn">Download Image</button>
</div>

<script src="script.js"></script>

</body>
</html>
